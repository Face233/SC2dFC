base: E0036_fc1_direct_residual_transformer_mse_v1.yaml

training:
  loss_type: mse
  loss_weights:
    edge: 0.0
    difference: 1.0
    variance: 1.0
    static: 0.0
    contrastive: 0.0

experiment:
  id: E0039
  name: fc1_direct_residual_transformer_difference_variance_only_v1
  level: 1
  task: sequence
  research_question: 去掉逐点MSE、只用等权差分和方差损失训练E0036架构，能否预测真实未来动态？
  hypothesis: 差分与方差等权可能缓解动态振幅坍缩，但目标对整段常数偏移不敏感；需要用真实时间相关和数值偏差共同判读。
  primary_change: 在E0036相同FC1-only直接残差Transformer上，只使用相邻窗差分MSE与逐边时间方差MSE，权重均为1.0；逐点边MSE及其他损失权重为零。
  baseline: E0036
  owner: Face88
  status: planned
  ablation: fc1_only

decision_rule:
  description: 完成150轮，沿用验证集t=17:223长期边MSE选模以与E0036及E0038对照；报告被试配对长期MSE、逐边时间Pearson、动态差分相关、动态标准差比及残差时间均值偏差。即使方差提高，若时间相关无实质改善或数值偏移显著，不宣称预测有效；不查看测试集。
