base: E0028_gcn_transformer_static_anchor_w005_e150_v1.yaml

training:
  loss_weights:
    static: 0.1

experiment:
  id: E0029
  name: gcn_transformer_static_anchor_w01_e150_v1
  level: 1
  task: sequence
  research_question: 在E0028相同的GCN+Transformer、150轮训练与动态损失条件下，将未来平均FC的static锚点从0.05提高至0.1，能否继续改善个体平均FC与静态检索，同时不使动态个体性进一步塌缩
  hypothesis: E0028中static项约占验证目标的19.5%；提高至0.1将使其成为更实质的优化约束，可能继续改善静态指纹，但也可能将预测进一步拉向共享低频模板并损害差分时间结构。
  primary_change: 相对E0028仅将逐被试未来平均FC MSE的static权重从0.05提高至0.1；模型、GCN条件编码、冻结decoder、数据、seed、150轮训练、warm-up余弦日程、差分与方差损失均不变。
  baseline: E0028
  owner: Face88
  status: planned
  ablation: full

decision_rule:
  description: 完整训练150轮，不早停，不查看测试集；以E0028作为唯一配对参照，先记录未加权static、差分和方差损失及其梯度尺度。验证集同时报告平均FC与边MSE、被试检索和跨被试离散度，以及去时间均值后的跨被试动态相似性、差分时间相关、差分标准差比和动态幅值。只有静态复原与个体性改善且动态指标未明显恶化时，才认为0.1有益；若仅降低边MSE或更接近群体均值，则不视为解决共享轨迹问题。不同损失定义的objective_loss不作横向排名。
