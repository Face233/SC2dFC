experiment:
  id: E0032
  name: fc1_decay_template_v1
  level: 1
  task: analytic
  research_question: 在只观察首窗FC时，训练集拟合的时距衰减系数能否改善未来FC预测，并量化首窗个体偏移在长期区间的可泛化保留程度？
  hypothesis: 训练集拟合的alpha[t]会比固定alpha=1更稳健；若长期仍不优于群体模板，则首窗对长期FC的可检出增益有限。
  primary_change: 以训练折跨被试跨边最小二乘拟合的共享alpha[t]替代固定首窗偏移系数1；不训练神经网络。
  baseline: E0031
  owner: Face88
  status: planned
  ablation: full

model:
  name: fc1_decay_template

training:
  seeds:
  - 42
  loss_weights:
    edge: 0.0
    difference: 0.0
    variance: 0.0

evaluation:
  primary_metric: long_edge_mse
  bootstrap_replicates: 2000

decision_rule:
  description: 只使用训练折拟合alpha[t]；在验证集比较群体模板、FC1持续、E0031固定alpha=1零残差和E0032。若E0032相对群体模板及E0031零残差的长期边MSE被试bootstrap区间上界均小于0，确认首窗偏移的时距校准带来可泛化增益；否则保留完整诊断但不宣称长期增益。不得查看测试集或用验证结果重新拟合alpha。
