base: E0026_gcn_transformer_dynamic_only_mse_w1_warmup_cosine_e150_v1.yaml

training:
  loss_weights:
    edge: 0.0
    difference: 1.0
    variance: 1.0
    static: 0.0
    contrastive: 0.005

experiment:
  id: E0030
  name: gcn_transformer_contrastive_long_future_e150_v1
  level: 1
  task: sequence
  research_question: 在E0026相同的GCN+Transformer、150轮训练与动态损失条件下，移除static锚点并加入远期被试检索损失，能否减少被试间预测同质化，同时不恶化长程dFC动态恢复
  hypothesis: 仅靠差分与方差损失时，模型可用共享轨迹最小化风险；远期被试检索损失将要求预测的非重叠未来平均FC更匹配本人而非同batch其他被试的真实未来，从而改善被试检索与跨被试离散度。若动态时间相关仍接近零，则表明静态身份区分本身不足以恢复逐窗动态。
  primary_change: 相对E0026，仅移除未启用的static项并新增权重0.005的远期双向InfoNCE被试检索损失；保持差分与方差损失、GCN+Transformer、冻结decoder、数据、seed、batch size=4和150轮warm-up余弦训练不变。
  baseline: E0026
  owner: Face88
  status: planned
  ablation: full

decision_rule:
  description: 完整训练150轮，不早停，不查看测试集；在验证集报告未加权contrastive、difference和variance损失及其梯度尺度，并与E0026配对比较平均FC/边MSE、被试检索、跨被试预测距离矩阵及离散度、去时间均值动态相似性、差分时间相关、差分标准差比和动态幅值。仅当检索或跨被试个体性改善且动态指标未明显恶化时，才认为检索损失有益；仅因人为拉开预测而不提高同被试匹配不视为成功。当前batch size=4每样本仅有3个batch内负样本；若结果受限，再单独设计增大有效负样本数的实验。
