base: E0004_gcn_gru_full_v1.yaml

data:
  # FC[0:5] conditions the model and FC[5:] is the only prediction target.
  # The five windows cover 74.16 s and retain four initial change directions.
  warmup_windows: 5

model:
  warmup_encoder: gru
  warmup_gru_layers: 1

training:
  # Match E0014 exactly: the warmup-window comparison is not confounded by a
  # robust loss before baseline fit is established.
  loss_type: mse

experiment:
  id: E0015
  name: gcn_gru_warmup_k5_v1
  level: 1
  task: sequence
  research_question: 提供五个初始FC窗口及其变化方向，能否改善个体长程dFC预测并缓解动态塌缩
  hypothesis: K=5会提升共同时间后缀和non-overlap区间的长时残差相关、差分时间相关及动态幅度校准
  primary_change: 在E0014相同的warmup GRU下，将条件由FC[0]扩展为FC[0:5]，标签严格改为FC[5:]
  baseline: E0014
  owner: Face88
  status: planned
  ablation: full

decision_rule:
  description: 不与K=1的全部未来序列直接比较；只在FC[5:]共同绝对时间后缀和相对最后warmup窗口17步后的non-overlap区间比较验证集。至少一项长程动态指标改善且edge MSE恶化不超过2%才进入多seed阶段。
