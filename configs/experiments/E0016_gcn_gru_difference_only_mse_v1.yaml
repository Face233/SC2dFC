base: E0012_gcn_gru_dynamic_only_v1.yaml

training:
  # Explicitly use pure MSE for the pointwise temporal-difference term.
  # The inherited huber_beta is inert because loss_type is mse.
  loss_type: mse
  loss_weights:
    edge: 0.0
    difference: 3.0
    variance: 0.0

experiment:
  id: E0016
  name: gcn_gru_difference_only_mse_v1
  level: 1
  task: sequence
  research_question: 在E0012无边重建的动态压力测试中，单独使用一阶差分MSE是否足以恢复真实的dFC变化方向与细节
  hypothesis: 单独的差分MSE可诱导非平坦时间变化，但缺少方差校准时动态幅值和低频功率仍会偏离真实序列
  primary_change: 从E0012的3·L_diff + 3·L_var中移除L_var，仅保留3·L_diff（MSE）
  baseline: E0012
  owner: Face88
  status: planned
  ablation: difference_only

decision_rule:
  description: 固定完成50个epoch，仅在验证集运行动态审计且不查看测试集；与E0012比较差分时间相关、差分标准差比和频段功率比。若变化方向改善但幅值/功率仍失配，说明L_diff主要提供时间方向而不足以校准幅值。
