base: ../default.yaml
experiment:
  id: E0012
  name: gcn_gru_dynamic_only_v1
  level: 1
  task: sequence
  research_question: 在固定E0004的GCN、GRU、SC加FC1条件、冻结E0003 decoder与数据划分下，移除边重建约束后，difference和variance损失能否使预测dFC出现非平坦的时间波动
  hypothesis: 若仅动态损失即可产生稳定且非高频抖动的时间波动，当前过平滑主要是边重建与动态约束之间的优化折中；若仍显著平滑，则初始条件、时序模型或冻结decoder更可能是瓶颈
  primary_change: 移除edge损失，将difference与全程variance权重均设为3.0，并以固定50个epoch完成动态能力压力测试
  baseline: E0010
  owner: Face88
  status: planned
  ablation: full
