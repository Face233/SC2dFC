decision_rule:
  description: 完整训练150轮，不早停，不查看测试集；验证集分别报告复原误差、平均FC、条件交换敏感性、个体离散程度及去均值动态，不以动态目标或振幅单项改善宣告成功。余弦曲线随150轮拉长，不将结果单独解释为增加50轮的纯效应。
